name: Deploy to GKE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials mathverse-gke-dev \
            --zone asia-south1-a \
            --project mathverse-platform-dev

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build Backend Image
        run: |
          docker build -t asia-south1-docker.pkg.dev/mathverse-platform-dev/mathverse-repo/mathverse-backend:${{ github.sha }} ./backend

      - name: Push Backend Image
        run: |
          docker push asia-south1-docker.pkg.dev/mathverse-platform-dev/mathverse-repo/mathverse-backend:${{ github.sha }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install mathverse ./k8s/mathverse \
            --set backend.image.tag=${{ github.sha }}